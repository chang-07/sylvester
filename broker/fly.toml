# fly launch --copy-config --name sylvester-broker  (then: fly secrets set SNAPTRADE_CLIENT_ID=... SNAPTRADE_CLIENT_SECRET=...)
app = "sylvester-broker"
primary_region = "yyz"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
